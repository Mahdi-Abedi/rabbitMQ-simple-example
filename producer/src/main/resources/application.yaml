server:
  port: 8081

spring:
  application:
    name: producer
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  cloud:
    function:
      definition: sendMyMessage
    stream:
      bindings:
        sendMyMessage-out-0:
          destination: my.exchange
          content-type: application/json
      rabbit:
        bindings:
          sendMyMessage-out-0:
            producer:
              routing-key-expression: '''my.routing.key'''
  integration:
    poller:
      fixed-delay: 5000
server:
  port: 8082

spring:
  application:
    name: consumer
  cloud:
    function:
      definition: processMyMessage
    stream:
      bindings:
        processMyMessage-in-0:
          destination: my.exchange
          group: my-group
      rabbit:
        bindings:
          processMyMessage-in-0:
            consumer:
              binding-routing-key: my.routing.key
